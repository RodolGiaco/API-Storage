spring.application.name=api-storage

# Actuator: por defecto Spring Boot solo expone "health" via HTTP; agregamos
# "info" explicitamente y dejamos todo lo demas (env, beans, mappings, etc.)
# inalcanzable sin necesidad de una capa de seguridad adicional.
management.endpoints.web.exposure.include=health,info

# El commit y la rama llegan a /actuator/info via git.properties, generado
# por el plugin git-commit-id-maven-plugin (ver pom.xml). Modo "simple"
# (el default) porque "full" expone ademas el email del autor del commit y
# el hostname de la maquina de build, de mas para un endpoint sin auth.
management.info.git.mode=simple
