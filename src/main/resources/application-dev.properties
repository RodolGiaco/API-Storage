# Perfil dev: H2 en memoria, sin Docker ni credenciales que gestionar. Pensado
# para que el proyecto arranque apenas se clona. La base se pierde en cada
# restart -- es lo que se quiere acá, no un descuido.
spring.datasource.url=jdbc:h2:mem:api-storage;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: recrea el schema en cada arranque a partir de las entidades.
# Tiene sentido solo porque la base es efimera; en "postgres" (base real,
# persistente) esto NO se usa -- ver application-postgres.properties.
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web de H2, util para inspeccionar la base en dev. No existe en el
# perfil postgres porque no tiene sentido contra una base real.
spring.h2.console.enabled=true
