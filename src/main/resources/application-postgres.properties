# Perfil postgres: apunta al contenedor de docker-compose.yml. Las
# credenciales vienen de variables de entorno -- nunca hardcodeadas -- pero
# con un default que coincide con .env.example: asi "cp .env.example .env &&
# docker compose up -d && ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres"
# funciona sin tener que exportar el .env al shell que corre Maven (Spring
# Boot no lee archivos .env por si solo). Si en tu .env real cambiaste las
# credenciales, tenes que exportarlas vos (o usar un plugin tipo
# spring-dotenv) para que dejen de usarse estos defaults.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:api_storage}
spring.datasource.username=${POSTGRES_USER:api_storage}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

# none, no create-drop: esto apunta a una base real y persistente (volumen
# de docker-compose), no a la efimera de "dev". Sin una herramienta de
# migraciones (Flyway/Liquibase, todavia no agregada) dejar que Hibernate
# autogenere o pise el schema es la puerta de entrada a perder datos o
# migraciones aplicadas a mano sin que quede registro. El dia que se agregue
# Flyway, esto se mantiene en "none" -- las migraciones pasan a ser dueñas
# del schema, no Hibernate.
spring.jpa.hibernate.ddl-auto=none
